<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PubChat</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/static/pubchat.css">

  <meta name="description" content="PubChat attaches Bluesky discussion to academic papers.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="PubChat">
  <meta property="og:description" content="Attach Bluesky discussion to academic papers.">
  <meta property="og:url" content="https://pubchat.org/">
  <meta property="og:image" content="https://pubchat.org/static/pubchat-card.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PubChat">
  <meta name="twitter:description" content="Attach Bluesky discussion to academic papers.">
  <meta name="twitter:image" content="https://pubchat.org/static/pubchat-card.png">

</head>

<body class="home-page">
  <main>
    <div class="container">
      <div class="title">
        <img src="/static/favicon.png" alt="PubChat logo">
        <span>PubChat</span>
      </div>

      <form id="pubchat-form" action="/open" method="get">
	<input
	  id="pubchat-input"
	  name="q"
	  type="text"
	  placeholder="Enter an arXiv ID, arXiv URL, DOI, or DOI URL"
	  autocomplete="off"
	  autofocus
	  required
	  >

        <div class="button-row">
          <button type="submit">Open</button>
          <a href="/static/guide.html">Help</a>
        </div>
      </form>
    </div>
  </main>
  
</body>
</html>
