<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PubChat</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32" type="image/png">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: white;
      color: #0f1419;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 32px;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 48px;
  font-weight: 500;
  letter-spacing: -0.5px;
  color: #0f1419;
}

.title img {
  width: 52px;
  height: 52px;
  object-fit: contain;
}

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    h1 {
      font-size: 56px;
      font-weight: 600;
      margin: 0 0 32px 0;
      letter-spacing: -1px;
    }

    form {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    input {
      flex: 1;
      font-size: 17px;
      padding: 14px 18px;
      border: 1px solid #d0d7de;
      border-radius: 24px;
      outline: none;
      transition: all 0.15s ease;
    }

    input:focus {
      border-color: #0a7cff;
      box-shadow: 0 0 0 3px rgba(10, 124, 255, 0.12);
    }

    button {
      font-size: 15px;
      padding: 10px 18px;
      border: 1px solid #d0d7de;
      border-radius: 20px;
      background: #f6f8fa;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #eef2f6;
    }

    .hint {
      margin-top: 18px;
      color: #536471;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <div class="title">
  <img src="/static/favicon.png" alt="PubChat logo">
  <span>PubChat</span>
      </div>



      <form id="pubchat-form">
        <input
          id="pubchat-input"
          type="text"
          placeholder="Enter an arXiv ID or URL like 2601.22079 or https://arxiv.org/abs/2601.22079"
          autocomplete="off"
          autofocus
        >
        <button type="submit">Open</button>
      </form>

    </div>
  </main>

  <script>
    function parseArxivInput(raw) {
      const s = raw.trim();

      const urlMatch = s.match(/arxiv\.org\/(?:abs|pdf)\/(\d{4}\.\d{4,5})(?:v\d+)?/i);
      if (urlMatch) return urlMatch[1];

      const idMatch = s.match(/^(\d{4}\.\d{4,5})(?:v\d+)?$/);
      if (idMatch) return idMatch[1];

      return null;
    }

    document.getElementById("pubchat-form").addEventListener("submit", event => {
      event.preventDefault();

      const id = parseArxivInput(document.getElementById("pubchat-input").value);

      if (!id) {
        alert("Please enter a valid arXiv ID or arXiv URL.");
        return;
      }

      window.location.href = `/chat/arxiv/${id}`;
    });
  </script>
</body>
</html>
