<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PubChat</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32" type="image/png">

  <meta name="description" content="PubChat attaches Bluesky discussion to academic papers.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="PubChat">
  <meta property="og:description" content="Attach Bluesky discussion to academic papers.">
  <meta property="og:url" content="https://pubchat.org/">
  <meta property="og:image" content="https://pubchat.org/static/pubchat-card.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PubChat">
  <meta name="twitter:description" content="Attach Bluesky discussion to academic papers.">
  <meta name="twitter:image" content="https://pubchat.org/static/pubchat-card.png">

  <style>

    :root {
     --accent: #8b6fe8;
     --accent-soft: rgba(139, 111, 232, 0.18);
    }
    
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: white;
      color: #0f1419;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;

      font-size: 56px;
      font-weight: 500;
      letter-spacing: -0.8px;
    }

    .title img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    input {
      width: 100%;
      font-size: 17px;
      padding: 14px 18px;
      border: 1px solid #d0d7de;
      border-radius: 24px;
      outline: none;
      transition: all 0.15s ease;
    }

    input:focus {
	border-color: var(--accent);
	box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .button-row button,
    .button-row a {
      font-size: 15px;
      padding: 10px 18px;
      border: 0px solid #d0d7de;
      border-radius: 10px;
      background: #f6f8fa;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
      color: #0f1419;
      line-height: 1.2;
    }

    .button-row button:hover,
    .button-row a:hover {
	border-color: var(--accent);
    }

    @media (max-width: 600px) {
      main {
        padding: 16px;
      }

      .title {
        font-size: 40px;
        margin-bottom: 28px;
      }

      .title img {
        width: 36px;
        height: 36px;
      }

      input {
        width: 100%;
        font-size: 16px;
        padding: 12px 16px;
      }

      .button-row {
        width: 100%;
        flex-direction: column;
      }

      .button-row button,
      .button-row a {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <div class="title">
        <img src="/static/favicon.png" alt="PubChat logo">
        <span>PubChat</span>
      </div>

      <form id="pubchat-form">
        <input
          id="pubchat-input"
          type="text"
          placeholder="Enter an arXiv ID or URL like 2601.22079 or https://arxiv.org/abs/2601.22079"
          autocomplete="off"
          autofocus
        >

        <div class="button-row">
          <button type="submit">Open</button>
          <a href="/static/guide.html">Help</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    function parseArxivInput(raw) {
      const s = raw.trim();

      const urlMatch = s.match(/arxiv\\.org\\/(?:abs|pdf)\\/(\\d{4}\\.\\d{4,5})(?:v\\d+)?/i);
      if (urlMatch) return urlMatch[1];

      const idMatch = s.match(/^(\\d{4}\\.\\d{4,5})(?:v\\d+)?$/);
      if (idMatch) return idMatch[1];

      return null;
    }

    document.getElementById("pubchat-form").addEventListener("submit", event => {
      event.preventDefault();

      const id = parseArxivInput(document.getElementById("pubchat-input").value);

      if (!id) {
        alert("Please enter a valid arXiv ID or arXiv URL.");
        return;
      }

      window.location.href = `/chat/arxiv/${id}`;
    });
  </script>
</body>
</html>
